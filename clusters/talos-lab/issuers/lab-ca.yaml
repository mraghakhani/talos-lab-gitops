# Self-signed Root CA chain for the lab, backed by cert-manager.
#
# lab-selfsigned  bootstraps the trust anchor
# lab-ca-root     the CA certificate/keypair (secret: lab-ca-keypair)
# lab-ca          the ClusterIssuer every leaf Certificate references
#
# All key material is generated by cert-manager; nothing sensitive is stored
# in Git. Browsers must import the lab-ca-root certificate to trust leaf
# certificates such as argocd-tls.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: talos-lab Root CA
  secretName: lab-ca-keypair
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: lab-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca-keypair